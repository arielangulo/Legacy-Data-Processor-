- name: Deploy Data Processor
  hosts: dataproc
  become: true

  tasks:
    - name: Create dataproc group
      ansible.builtin.group:
        name: dataproc
        gid:  2048
        state: present

    - name: Create dataproc user
      ansible.builtin.user:
        name: dataproc
        uid:  2048
        group: dataproc
        shell: /usr/sbin/nologin
        create_home: false
        state: present
