- name: Deploy Data Processor
  hosts: dataproc
  become: true

  tasks:
    - name: Create dataproc group
      ansible.builtin.group:
        name: dataproc
        gid:  2048
        state: present

    - name: Create dataproc user
      ansible.builtin.user:
        name: dataproc
        uid:  2048
        group: dataproc
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow application port 8080
      community.general.ufw:
        rule: allow
        port:  "8080"
        proto: tcp

    - name: Enable UFW and deny incoming by default
      community.general.ufw:
        state:  enabled
        policy:  deny
        direction: incoming

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Make sure Docker is running and available
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Application directory
      ansible.builtin.file:
        path: /opt/dataproc/app
        state: directory
        owner: dataproc
        group: dataproc
        mode: "0755"

    - name: Copy application files inside the directory
      ansible.builtin.copy:
        src: app/
        dest: /opt/dataproc/app/
        owner: dataproc
        group: dataproc
        mode: preserve

    - name: Make entrypoint.sh executable with correct permissions
      ansible.builtin.file:
        path: /opt/dataproc/app/entrypoint.sh
        owner: dataproc
        group: dataproc
        mode: "0755"
        state: file
