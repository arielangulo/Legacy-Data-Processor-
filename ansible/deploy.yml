- name: Deploy Data Processor
  hosts: dataproc
  become: true

  tasks:
    - name: Create dataproc group
      ansible.builtin.group:
        name: dataproc
        gid:  2048
        state: present

    - name: Create dataproc user
      ansible.builtin.user:
        name: dataproc
        uid:  2048
        group: dataproc
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow application port 8080
      community.general.ufw:
        rule: allow
        port:  "8080"
        proto: tcp

    - name: Enable UFW and deny incoming by default
      community.general.ufw:
        state:  enabled
        policy:  deny
        direction: incoming
